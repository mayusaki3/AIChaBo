name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # utiltests パッケージ内の *_test.py を全て “モジュール実行” で回す
      - name: Run utiltests
        shell: bash
        run: |
          python - <<'PY'
          import pkgutil, importlib, runpy, sys
          try:
              import utiltests
          except ImportError:
              print("No utiltests package found. Skipping.")
              sys.exit(0)
          mods = [m.name for m in pkgutil.iter_modules(utiltests.__path__) if m.name.endswith('_test')]
          if not mods:
              print("No *_test.py under utiltests/.")
              sys.exit(0)
          rc = 0
          for name in sorted(mods):
              print(f"::group::Running utiltests.{name}")
              try:
                  # __main__として実行（あなたのテストと同じ動き）
                  runpy.run_module(f"utiltests.{name}", run_name="__main__")
              except SystemExit as e:
                  if e.code != 0:
                      rc = rc or int(e.code)
              except Exception as e:
                  print("ERROR:", repr(e))
                  rc = 1
              print("::endgroup::")
          sys.exit(rc)
          PY
