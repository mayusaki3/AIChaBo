name: github
locale: ja

triggers:
  any_keywords:
    - GitHub
    - github
    - リポジトリ
    - README
    - readme
    - ソース
    - コード
    - 参照
    - Issue
    - Pull Request
    - ブランチ
    - develop
    - main
    - master

# URLから owner/repo/ref を抽出
url_patterns:
  - type: github
    regexes:
      # 例: https://github.com/owner/repo
      - "^https?://github\\.com/(?P<owner>[^/]+)/(?P<repo>[^/#?]+)(?:$|[?#].*)"
      # 例: https://github.com/owner/repo/tree/branch/path...
      - "^https?://github\\.com/(?P<owner>[^/]+)/(?P<repo>[^/#?]+)/tree/(?P<ref>[^/#?]+)(?:/.*)?$"
      # 例: https://raw.githubusercontent.com/owner/repo/ref/path/to/file.py
      - "^https?://raw\\.githubusercontent\\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/(?P<ref>[^/]+)/.+$"
      # API 経由（保険）
      - "^https?://api\\.github\\.com/repos/(?P<owner>[^/]+)/(?P<repo>[^/]+)(?:/.*)?$"

entity_extractors:
  owner_repo:
    from: url
    format: "{owner}/{repo}"
  ref:
    from: url
    optional: true

defaults:
  # 既定の候補順: 指定ref > defaultBranch > develop > main > master
  fallback_refs: ["develop", "main", "master"]
  max_raw_files: 8
  allow_exts: [".py", ".md", ".txt", ".yml", ".yaml", ".json"]

assistant_rules:
  - "根拠となるURLやAPI応答に基づき、**要約の末尾に出典（URL）**を示す。"
  - "このメッセージ直後に自分の**追投稿が無い場合**、『すぐに続けますね』『少々お待ちください』『続けます/続きます』の類は**使用しない**。代わりに**『続けますか？』**とユーザーの投稿を促す。"
  - "本文を省略する場合、コードブロック外に**（長文のため一部省略）**などの補足を置く。"
  - "日本語で簡潔・要点先行。差分や一覧は必要に応じてコードブロックで表示する。"

query_templates:
  # URLあり + owner/repo + ref特定
  - when: { has_url: true, has_owner_repo: true, has_url_ref: true }
    queries:
      - "https://api.github.com/repos/{owner_repo}"
      - "https://api.github.com/repos/{owner_repo}/branches"
      - "https://api.github.com/repos/{owner_repo}/git/trees/{ref}?recursive=1"

  # URLあり + owner/repo まで分かる（ref不明）
  - when: { has_url: true, has_owner_repo: true, has_url_ref: false }
    queries:
      - "https://api.github.com/repos/{owner_repo}"
      - "https://api.github.com/repos/{owner_repo}/branches"

  # テキストのみ（owner/repo 指定あり）
  - when: { has_owner_repo: true }
    queries:
      - "https://api.github.com/repos/{owner_repo}"
      - "https://api.github.com/repos/{owner_repo}/branches"

followup_hints:
  # meta 取得後: ref 決定 → tree → raw 本文
  - step: "pick-ref"
    details: |
      指定refが無ければ default_branch を優先し、無ければ {fallback_refs} の順に試す。
  - step: "read-tree"
    details: |
      "https://api.github.com/repos/{owner_repo}/git/trees/{ref}?recursive=1"
      からファイル一覧を取得し、{allow_exts} を優先して最大 {max_raw_files} 件まで Raw を読む。
  - step: "read-raw"
    details: |
      "https://raw.githubusercontent.com/{owner_repo}/{ref}/{path}" で本文を取得。
      1ファイルごとに 4000 文字程度を上限に要約し、出典URLを添付する。
  - step: "finish"
    details: |
      直後に追投稿が無い場合は、本文の末尾で『続けますか？（必要なら「続けて」と送ってください）』と促す。

output_templates:
  - name: "summary"
    when: { }
    format: |
      # 解析結果（{owner_repo}@{ref}）
      - 取得ファイル数: {n_files} 件
      - 主な変更点/観点: {highlights}

      {per_file_sections}

      出典:
      {citations}
